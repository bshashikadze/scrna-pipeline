[project]
name = "scrna-pipeline"
version = "0.1.0"
description = "Single-cell RNA-seq pipeline demonstrated on human diabetic kidney disease data (GSE131882). Python handles ingestion/QC/orchestration/provenance; R (Seurat) handles normalization/integration/clustering/annotation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "scrublet>=0.2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "snakemake>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrna_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
