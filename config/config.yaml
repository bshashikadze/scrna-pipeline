# scrna-pipeline configuration

dataset:
  geo_accession: GSE131882
  raw_dir: data/raw
  samples:
    GSM3823939: {condition: control, donor: "1"}
    GSM3823940: {condition: control, donor: "2"}
    GSM3823941: {condition: control, donor: "3"}
    GSM3823942: {condition: diabetes, donor: "4"}
    GSM3823943: {condition: diabetes, donor: "5"}
    GSM3823944: {condition: diabetes, donor: "6"}

qc:
  min_genes_per_cell: 200
  max_pct_mito: 20
  min_cells_per_gene: 3
  expected_doublet_rate: 0.06

normalization:
  method: log1p_scran   # or sctransform
  n_hvgs: 2000

integration:
  batch_key: donor
  n_pcs: 30

clustering:
  resolution: 1.0

paths:
  interim_dir: results/interim
  processed_dir: results/processed
  figures_dir: results/figures
